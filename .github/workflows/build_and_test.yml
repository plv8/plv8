name: plv8 Build and Test
on:
  push:
  pull_request:
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        version:
          [
            REL_14_STABLE,
            REL_15_STABLE,
            REL_16_STABLE,
            REL_17_STABLE,
            REL_18_STABLE,
            REL_19_STABLE
          ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Test details
        run: echo Build and test plv8 on ${{ matrix.os }} with PostgreSQL ${{ matrix.version }} branch

      - name: Checkout and build PostgreSQL code
        run: |
          sudo apt-get update -qq
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys E298A3A825C0D65DFD57CBB651716619E084DAB9
          sudo apt-get install -y build-essential libreadline-dev zlib1g-dev flex bison libxml2-dev libxslt-dev libssl-dev libxml2-utils xsltproc ccache pkg-config libc++-dev libc++abi-dev libglib2.0-dev libtinfo6 cmake libstdc++-12-dev
          rm -rf postgres
          git clone --branch ${{ matrix.version }} --single-branch --depth 1 https://github.com/postgres/postgres.git
          pushd postgres
          git branch
          ./configure --prefix=$PWD/inst/  --enable-cassert --enable-debug --with-openssl
          make -j4 install

      - name: Start Postgres
        run: |
          pushd postgres
          cd inst/bin
          ./initdb -D data
          ./pg_ctl -D data -l logfile start
          popd

      - name: Checkout plv8 extension code
        uses: actions/checkout@v2
        with:
          path: plv8

      - name: Build and test plv8 extension
        id: regression-tests
        run: |
          export PATH="${PWD}/postgres/inst/bin:$PATH"
          pushd plv8
          make install
          make installcheck
          popd

      - name: Print regression.diffs if regression tests failed
        if: failure() && steps.regression-tests.outcome != 'success'
        run: |
          cat plv8/regression.diffs

  # Rocky Linux 10 ships GCC 14, and its rpm build macros export CC, CXX and
  # the *FLAGS variables into every %build.  Both broke the bundled V8 build
  # in the past (#604), so build and test the way an EL10 rpm build would.
  build-and-test-el10:
    strategy:
      matrix:
        pg_major: [18]
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10

    steps:
      - name: Test details
        run: echo Build and test plv8 on Rocky Linux 10 with PGDG PostgreSQL ${{ matrix.pg_major }}

      - name: Install build dependencies and PostgreSQL
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-10-$(uname -m)/pgdg-redhat-repo-latest.noarch.rpm
          dnf install -y gcc gcc-c++ cmake make git patch python3 which redhat-rpm-config \
            postgresql${{ matrix.pg_major }}-devel postgresql${{ matrix.pg_major }}-server

      - name: Start PostgreSQL
        run: |
          mkdir -p /var/lib/pgsql/${{ matrix.pg_major }}/data
          chown -R postgres:postgres /var/lib/pgsql/${{ matrix.pg_major }}
          su postgres -c "/usr/pgsql-${{ matrix.pg_major }}/bin/initdb -D /var/lib/pgsql/${{ matrix.pg_major }}/data"
          su postgres -c "/usr/pgsql-${{ matrix.pg_major }}/bin/pg_ctl -D /var/lib/pgsql/${{ matrix.pg_major }}/data -l /tmp/postgresql.log start"

      - name: Checkout plv8 extension code
        uses: actions/checkout@v4
        with:
          path: plv8

      - name: Build and test plv8 extension
        id: regression-tests-el10
        run: |
          export PATH="/usr/pgsql-${{ matrix.pg_major }}/bin:$PATH"
          # Reproduce the rpmbuild environment: EL10 applies %set_build_flags
          # automatically, exporting CC, CXX, CFLAGS, CXXFLAGS and LDFLAGS.
          eval "$(rpm --eval %set_build_flags)"
          # The Makefile runs git to fetch the v8-cmake submodule; make sure git
          # accepts the checkout regardless of which uid created it.
          git config --global --add safe.directory "$(pwd)/plv8"
          pushd plv8
          make with_llvm=no
          make install with_llvm=no
          chown -R postgres .
          su postgres -c "PATH=$PATH make installcheck with_llvm=no"
          popd

      - name: Print regression.diffs if regression tests failed
        if: failure() && steps.regression-tests-el10.outcome != 'success'
        run: |
          cat plv8/regression.diffs
